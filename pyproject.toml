[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "us_water_intensity"
version = "0.1.0"
description = "Water consumed per kWh of U.S. electricity, by eGRID subregion and year"
authors = [{name = "Zachary Schmidt"}, {name = "Jonathan Koomey"}]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# Version ranges the code needs. The exact versions used to produce the
# published results are pinned in requirements.txt.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "openpyxl>=3.1",  # .xlsx workbooks (eGRID 2014+, EIA-860/923)
    "xlrd>=2.0",      # .xls workbooks (eGRID 1998-2007)
    "requests>=2.31", # downloads and EIA API calls
]

[tool.setuptools.packages.find]
include = ["us_water_intensity*"]
